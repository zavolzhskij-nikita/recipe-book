{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кулинарная книга</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header>
    <a href="/" class="logo">Кулинарная книга</a>
        <nav>
      <a href="/recipes/">Рецепты</a>
      {% if user.is_authenticated %}
        <a href="/recipes/add/" class="btn-add">+ Добавить рецепт</a>
        <a href="/profile/">Профиль</a>
        <form method="post" action="{% url 'logout' %}" style="margin: 0;">
          {% csrf_token %}
          <button type="submit" style="background:none;border:none;color:var(--text-main);cursor:pointer;font:inherit;padding:0;font-weight:500;">Выйти</button>
        </form>
      {% else %}
        <a href="/login/">Войти</a>
        <a href="/register/" class="btn-add">Регистрация</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    © 2026 Кулинарная книга. Учебная практика.
  </footer>
</body>
</html>
