<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кулинарная книга</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background:#fdf8f3; color:#333; }
    header { background:#c0392b; color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
    header a { color:#fff; text-decoration:none; margin-right:16px; font-weight:500; }
    .container { max-width:1200px; margin:0 auto; padding:24px 16px; }
    .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
    .card { background:#fff; border-radius:8px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .card h3 { margin-bottom:8px; color:#c0392b; }
    .card p { color:#666; font-size:14px; margin-bottom:12px; }
    .btn { display:inline-block; padding:10px 18px; background:#c0392b; color:#fff; text-decoration:none; border-radius:6px; border:none; cursor:pointer; font-size:14px; }
    .btn:hover { background:#a93226; }
    input, textarea { width:100%; padding:10px; margin-bottom:12px; border:1px solid #ddd; border-radius:6px; font-family:inherit; font-size:14px; }
    h1 { margin-bottom:20px; }
    h2 { margin:24px 0 12px; }
    .search { display:flex; gap:8px; margin-bottom:20px; }
    .search input { margin:0; }

    @media (min-width:960px) { .container { padding:32px; } }
    @media (min-width:1200px) { .container { padding:40px 48px; } }
    @media (min-width:1920px) { .container { max-width:1600px; } }
    @media (min-width:2560px) { .container { max-width:2000px; } .grid { grid-template-columns:repeat(4, 1fr); gap:28px; } }
    @media (max-width:959px) { .grid { grid-template-columns:repeat(2, 1fr); } }
    @media (max-width:600px) { .grid { grid-template-columns:1fr; } header { padding:12px 16px; } }
  </style>
</head>
<body>
  <header>
    <a href="/" style="font-size:20px;font-weight:700;">🍳 Кулинарная книга</a>
    <nav>
      <a href="/recipes/">Рецепты</a>
      {% if user.is_authenticated %}
        <a href="/recipes/add/">+ Добавить</a>
        <a href="/profile/">Профиль</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
  {% csrf_token %}
  <button type="submit" style="background:none;border:none;color:#fff;cursor:pointer;font:inherit;">Выйти</button>
</form>
      {% else %}
        <a href="/login/">Войти</a>
        <a href="/register/">Регистрация</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
