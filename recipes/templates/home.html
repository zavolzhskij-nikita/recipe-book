{% extends 'base.html' %}
{% block content %}
<div style="background: #f3ede1; padding: 40px; border-radius: 16px; margin-bottom: 40px; text-align: center;">
  <h1 style="margin-bottom: 16px;">Свежие рецепты</h1>
  <form method="get" action="/recipes/" class="search" style="max-width: 600px; margin: 0 auto;">
    <input type="text" name="q" placeholder="Найти рецепт или ингредиент...">
    <button class="btn" type="submit">Найти</button>
  </form>
</div>
<div class="grid">
  {% for r in recipes %}
  <div class="card">
  <div style="height: 180px; margin-bottom: 16px; border-radius: 8px; overflow: hidden; background-color: #eaddcc; display: flex; align-items: center; justify-content: center;">
    {% if r.image_url %}
      <img src="{{ r.image_url }}" alt="{{ r.title }}" style="width: 100%; height: 100%; object-fit: cover;">
    {% else %}
      <!-- Заглушка, если нет фото -->
      <span style="font-size: 48px; opacity: 0.5;">🍽️</span>
    {% endif %}
  </div>
  
  <h3>{{ r.title }}</h3>
  <p>{{ r.description|truncatewords:15 }}</p>
  <a href="{% url 'recipe_detail' r.id %}" class="btn">Открыть</a>
</div>
  {% empty %}
  <p>Пока нет рецептов.</p>
  {% endfor %}
</div>
{% endblock %}
