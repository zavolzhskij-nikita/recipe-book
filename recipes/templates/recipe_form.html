{% extends 'base.html' %}
{% block content %}
<h1>Новый рецепт</h1>
<form method="post">
  {% csrf_token %}
  <input name="title" placeholder="Название" required>
  <input name="description" placeholder="Краткое описание" required>
  <textarea name="ingredients" placeholder="Ингредиенты" rows="5" required></textarea>
  <textarea name="steps" placeholder="Шаги приготовления" rows="8" required></textarea>
  <button class="btn" type="submit">Сохранить</button>
</form>
{% endblock %}
